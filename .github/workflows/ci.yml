name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -buildvcs=false

jobs:
  verify:
    name: Test, vet, and generated files (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # go.work pins the minimum (1.26). The newest stable line is tested
        # too so that a stdlib change in the encoding/json oracle — as with
        # Go 1.27's v2-backed encoding/json — shows up before a release,
        # not after: the conformance suite compares against stdlib by
        # design, so it is the first thing to notice such drift.
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Run ordinary tests and vet
        run: scripts/verify.sh quick
      - name: Regenerate fixtures
        working-directory: conformance
        run: go generate ./codec ./generator/compat ./generator/typeshape
      - name: Require a clean tree
        run: git diff --exit-code
